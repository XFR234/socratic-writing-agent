# Render 一键部署蓝图：在 render.com 新建 Blueprint 并选择本仓库即可
# 密钥（ZHIPU_API_KEY / ADMIN_PASSWORD）不会进仓库，部署时在 Render 控制台手动填入
services:
  - type: web
    name: socratic-writing-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: ZHIPU_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MODEL_NAME
        value: glm-4-flash
      - key: SECRET_KEY
        generateValue: true
